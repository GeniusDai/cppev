name: Cppev CI
run-name: Cppev CI 🚀
on: [push]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '>=1.20.0'

    - run: go install github.com/bazelbuild/bazelisk@latest
    - run: ln ~/go/bin/bazelisk ~/go/bin/bazel
    - run: export PATH="~/go/bin:$PATH"

    - run: bazel build //...
    - run: bazel test //... || bazel test //...
